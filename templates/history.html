{% extends 'base.html' %}{% block content %}<div class='d-flex justify-content-between mb-3'><h2>Transaction History</h2><div><a class='btn btn-outline-dark' href='{% url "quick" %}'>Quick Transaction</a> <a class='btn btn-dark' href='{% url "export" %}'>Export CSV</a></div></div><div class='card p-3 shadow-sm'><table class='table'><tr><th>Title</th><th>Amount</th><th>Type</th><th>Date</th><th></th></tr>{% for t in transactions %}<tr><td>{{t.title}}</td><td>₹ {{t.amount}}</td><td>{{t.get_transaction_type_display}}</td><td>{{t.date}}</td><td><form method='post' action='{% url "delete_transaction" t.pk %}'>{% csrf_token %}<button class='btn btn-sm btn-outline-danger'>Delete</button></form></td></tr>{% empty %}<tr><td colspan='5'>No transactions found.</td></tr>{% endfor %}</table></div>{% endblock %}
