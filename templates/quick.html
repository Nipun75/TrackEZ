{% extends 'base.html' %}{% block content %}<div class='row justify-content-center'><div class='col-md-6'><div class='card p-4 shadow-sm'><h2>Quick Transaction</h2><p class='text-muted'>Temporary calculation without saving.</p><form method='post'>{% csrf_token %}<label>Income</label><input class='form-control mb-2' name='income' type='number' step='0.01' value='0'><label>Expense 1</label><input class='form-control mb-2' name='expense' type='number' step='0.01' value='0'><label>Expense 2</label><input class='form-control mb-2' name='expense' type='number' step='0.01' value='0'><label>Expense 3</label><input class='form-control mb-3' name='expense' type='number' step='0.01' value='0'><button class='btn btn-dark'>Calculate</button></form>{% if result is not None %}<hr><h4>Remaining: ₹ {{result}}</h4>{% endif %}</div></div></div>{% endblock %}
