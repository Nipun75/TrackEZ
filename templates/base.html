<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackEZ Expense Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">TrackEZ</a>{% if user.is_authenticated %}<div><span class="text-white-50 me-3">{{ user.username }}</span><form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Logout</button></form></div>{% endif %}</div></nav><main class="container py-4">{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
